name: Release

# Push a tag like v1.2.0 to publish versioned images customers install:
#   ghcr.io/trinevia/chatboat-api:1.2.0, :1.2, :latest
#   ghcr.io/trinevia/chatboat-web:1.2.0, :1.2, :latest
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.2.0
        required: true

permissions:
  contents: write # create the GitHub release
  packages: write # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: trinevia

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: chatboat-api
            dockerfile: apps/api/Dockerfile
          - image: chatboat-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version from tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub release with the install bundle
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Package deploy/
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # install.sh offers this version by default.
          echo "${tag#v}" > deploy/VERSION
          tar -czf "chatboat-deploy-${tag}.tar.gz" --exclude='.env' --exclude='backups' deploy
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" chatboat-deploy-*.tar.gz --clobber
          else
            gh release create "$tag" chatboat-deploy-*.tar.gz --title "$tag" \
              --notes "Images: \`ghcr.io/${OWNER}/chatboat-api:${tag#v}\` and \`ghcr.io/${OWNER}/chatboat-web:${tag#v}\`. Upgrade notes: see CHANGELOG.md."
          fi
