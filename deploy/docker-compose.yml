# Chatboat private install. Start it with ./install.sh; upgrade with ./upgrade.sh <version>.
# All settings live in .env next to this file (written by install.sh, see .env.example).
name: ${COMPOSE_PROJECT_NAME:-chatboat}

x-image-api: &api-image ${CHATBOAT_REGISTRY:-ghcr.io/trinevia}/chatboat-api:${CHATBOAT_VERSION:?set CHATBOAT_VERSION in .env}

x-db-env: &db-env
  DATABASE_URL: postgres://chatboat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/chatboat
  ANALYST_DATABASE_URL: postgres://analyst_ro:${ANALYST_PASSWORD:?set ANALYST_PASSWORD}@postgres:5432/chatboat

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatboat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatboat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatboat -d chatboat']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  # One-shot: applies migrations and keeps the read-only analyst_ro role in sync, then exits.
  # Runs on every `up`, so upgrades migrate before the new API starts.
  migrate:
    image: *api-image
    command: migrate
    restart: 'no'
    env_file: .env
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  api:
    image: *api-image
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      <<: *db-env
      BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      WEB_ORIGIN: ${PUBLIC_URL}
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  web:
    image: ${CHATBOAT_REGISTRY:-ghcr.io/trinevia}/chatboat-web:${CHATBOAT_VERSION}
    restart: unless-stopped
    init: true
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  # HTTPS on ${DOMAIN}: certificates from Let's Encrypt (or Caddy's internal CA for localhost).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    logging: *logging

  # Nightly pg_dump to ./backups (kept BACKUP_KEEP_DAYS days), optionally copied to S3-compatible
  # storage. Run one now with:  docker compose exec backup chatboat-backup now
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/usr/local/bin/chatboat-backup']
    command: ['loop']
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: chatboat
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: chatboat
    volumes:
      - ./backup.sh:/usr/local/bin/chatboat-backup:ro
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
