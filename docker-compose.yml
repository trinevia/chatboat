services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chatboat
      POSTGRES_PASSWORD: chatboat
      POSTGRES_DB: chatboat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Local fake inbox for digest emails: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
